<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #FDF6EC;
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #101A33;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .airmail-strip {
      height: 16px;
      width: 100%;
      background: repeating-linear-gradient(
        -45deg,
        #C7402E 0,
        #C7402E 28px,
        #FDF6EC 28px,
        #FDF6EC 40px,
        #1F4FAE 40px,
        #1F4FAE 68px,
        #FDF6EC 68px,
        #FDF6EC 80px
      );
    }
    .content {
      padding: 38px 72px 42px 72px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-text {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #101A33;
    }
    .badge {
      background-color: #101A33;
      color: #FFFFFF;
      padding: 10px 22px;
      border-radius: 9999px;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(16, 26, 51, 0.12);
    }
    .hero {
      margin-top: 10px;
      margin-bottom: 24px;
    }
    .hero-title {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }
    .hero-title .accent {
      color: #C7402E;
    }
    .hero-sub {
      font-size: 25px;
      font-weight: 500;
      color: #4B5875;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }
    .cards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E6DED2;
      border-radius: 18px;
      padding: 24px 28px;
      box-shadow: 0 4px 20px rgba(16, 26, 51, 0.05), 0 1px 3px rgba(16, 26, 51, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .card-tag.blue {
      color: #1F4FAE;
    }
    .card-tag.red {
      color: #C7402E;
    }
    .card-headline {
      font-size: 21px;
      font-weight: 700;
      color: #101A33;
      letter-spacing: -0.015em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="airmail-strip"></div>
    <div class="content">
      <div class="header">
        <div class="logo-group">
          <svg width="44" height="48" viewBox="0 0 220 240" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="ei-clip">
                <path d="M0,0 L120,0 L150,23 L120,46 L0,46 Z"/>
              </clipPath>
            </defs>
            <rect x="97" y="14" width="26" height="212" rx="9" fill="#101A33"/>
            <rect x="99" y="18" width="6" height="204" rx="3" fill="#26365F" opacity="0.55"/>
            <g transform="translate(60,34) rotate(-4)">
              <path d="M0,4 L120,4 L150,27 L120,50 L0,50 Z" fill="#0E1526"/>
              <path d="M0,0 L120,0 L150,23 L120,46 L0,46 Z" fill="#16213E"/>
              <g clip-path="url(#ei-clip)" stroke="#2A3A63" stroke-width="1.4" opacity="0.5">
                <line x1="0" y1="11" x2="150" y2="11"/>
                <line x1="0" y1="23" x2="150" y2="23"/>
                <line x1="0" y1="35" x2="150" y2="35"/>
              </g>
              <circle cx="46" cy="23" r="6" fill="#0A0F1C"/>
              <path d="M43,23 h6 M46,20 v6" stroke="#5A6790" stroke-width="1.3" stroke-linecap="round"/>
            </g>
            <g transform="translate(160,97) rotate(3) scale(-1,1)">
              <path d="M0,4 L120,4 L150,27 L120,50 L0,50 Z" fill="#C7402E"/>
              <path d="M0,0 L120,0 L150,23 L120,46 L0,46 Z" fill="#EF5A45"/>
              <g clip-path="url(#ei-clip)" stroke="#D96A52" stroke-width="1.4" opacity="0.5">
                <line x1="0" y1="11" x2="150" y2="11"/>
                <line x1="0" y1="23" x2="150" y2="23"/>
                <line x1="0" y1="35" x2="150" y2="35"/>
              </g>
              <circle cx="46" cy="23" r="6" fill="#0A0F1C"/>
              <path d="M43,23 h6 M46,20 v6" stroke="#F2A594" stroke-width="1.3" stroke-linecap="round"/>
            </g>
            <g transform="translate(60,160) rotate(-3)">
              <path d="M0,4 L120,4 L150,27 L120,50 L0,50 Z" fill="#1F4FAE"/>
              <path d="M0,0 L120,0 L150,23 L120,46 L0,46 Z" fill="#2F6FE4"/>
              <g clip-path="url(#ei-clip)" stroke="#5A8CEC" stroke-width="1.4" opacity="0.5">
                <line x1="0" y1="11" x2="150" y2="11"/>
                <line x1="0" y1="23" x2="150" y2="23"/>
                <line x1="0" y1="35" x2="150" y2="35"/>
              </g>
              <circle cx="46" cy="23" r="6" fill="#0A0F1C"/>
              <path d="M43,23 h6 M46,20 v6" stroke="#9DB9F5" stroke-width="1.3" stroke-linecap="round"/>
            </g>
          </svg>
          <span class="logo-text">Elchi</span>
        </div>
        <div class="badge">BEPUL E'LON TAXTASI</div>
      </div>

      <div class="hero">
        <h1 class="hero-title"><span class="accent">Chamadoningizda</span> joy bormi?</h1>
        <p class="hero-sub">Sayohatchilar va pochta yubormoqchi bo'lganlar uchun bepul e'lon taxtasi</p>
      </div>

      <div class="cards-row">
        <div class="card">
          <div class="card-tag blue">✈️ UCHISH</div>
          <div class="card-headline">Chamadondagi bo'sh joyni e'lon qiling</div>
        </div>
        <div class="card">
          <div class="card-tag red">📦 POCHTA BOR</div>
          <div class="card-headline">Pochta yuborish uchun yo'lovchi toping</div>
        </div>
      </div>
    </div>
    <div class="airmail-strip"></div>
  </div>
</body>
</html>

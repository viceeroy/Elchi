<svg width="220" height="240" viewBox="0 0 220 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Elchi signpost icon">
  <defs>
    <clipPath id="ei-clip">
      <path d="M0,0 L120,0 L150,23 L120,46 L0,46 Z"/>
    </clipPath>
  </defs>

  <!-- post -->
  <rect x="97" y="14" width="26" height="212" rx="9" fill="#101A33"/>
  <rect x="99" y="18" width="6" height="204" rx="3" fill="#26365F" opacity="0.55"/>

  <!-- top sign: navy, right-pointing -->
  <g transform="translate(60,34) rotate(-4)">
    <path d="M0,4 L120,4 L150,27 L120,50 L0,50 Z" fill="#0E1526"/>
    <path d="M0,0 L120,0 L150,23 L120,46 L0,46 Z" fill="#16213E"/>
    <g clip-path="url(#ei-clip)" stroke="#2A3A63" stroke-width="1.4" opacity="0.5">
      <line x1="0" y1="11" x2="150" y2="11"/>
      <line x1="0" y1="23" x2="150" y2="23"/>
      <line x1="0" y1="35" x2="150" y2="35"/>
    </g>
    <circle cx="46" cy="23" r="6" fill="#0A0F1C"/>
    <path d="M43,23 h6 M46,20 v6" stroke="#5A6790" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- middle sign: red, mirrored to point left, same pivot logic as the others -->
  <g transform="translate(160,97) rotate(3) scale(-1,1)">
    <path d="M0,4 L120,4 L150,27 L120,50 L0,50 Z" fill="#C7402E"/>
    <path d="M0,0 L120,0 L150,23 L120,46 L0,46 Z" fill="#EF5A45"/>
    <g clip-path="url(#ei-clip)" stroke="#D96A52" stroke-width="1.4" opacity="0.5">
      <line x1="0" y1="11" x2="150" y2="11"/>
      <line x1="0" y1="23" x2="150" y2="23"/>
      <line x1="0" y1="35" x2="150" y2="35"/>
    </g>
    <circle cx="46" cy="23" r="6" fill="#0A0F1C"/>
    <path d="M43,23 h6 M46,20 v6" stroke="#F2A594" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- bottom sign: blue, right-pointing -->
  <g transform="translate(60,160) rotate(-3)">
    <path d="M0,4 L120,4 L150,27 L120,50 L0,50 Z" fill="#1F4FAE"/>
    <path d="M0,0 L120,0 L150,23 L120,46 L0,46 Z" fill="#2F6FE4"/>
    <g clip-path="url(#ei-clip)" stroke="#5A8CEC" stroke-width="1.4" opacity="0.5">
      <line x1="0" y1="11" x2="150" y2="11"/>
      <line x1="0" y1="23" x2="150" y2="23"/>
      <line x1="0" y1="35" x2="150" y2="35"/>
    </g>
    <circle cx="46" cy="23" r="6" fill="#0A0F1C"/>
    <path d="M43,23 h6 M46,20 v6" stroke="#9DB9F5" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
